# Compose local du SE graphique Mohhdy (OS-UI-0/1/2).
# Contexte : racine du depot (docker compose depuis osui/).
# ADMIN_TOKEN optionnel via l'environnement hote, jamais cuit dans l'image.
# Exemple : ADMIN_TOKEN=change-me docker compose up --build

services:
  mohhdy-os:
    build:
      context: ..
      dockerfile: osui/Dockerfile
    image: mohhdy-os:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MOHHDY_AGENT_HOST: "0.0.0.0"
      MOHHDY_AGENT_PORT: "8080"
      MOHHDY_AGENT_ROOT: "/app/agent"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MOHHDY_AGENT_CONFIG: "${MOHHDY_AGENT_CONFIG:-}"
      MOHHDY_AGENT_KB: "${MOHHDY_AGENT_KB:-}"
      MOHHDY_AGENT_DATA: "${MOHHDY_AGENT_DATA:-}"
      MOHHDY_AGENT_MODE: "${MOHHDY_AGENT_MODE:-self_host}"
      MOHHDY_AGENT_RUNTIME: "${MOHHDY_AGENT_RUNTIME:-docker}"
      MOHHDY_AGENT_SITE_ID: "${MOHHDY_AGENT_SITE_ID:-}"
    # Pas de env_file. Ne pas copier de secret dans le build.
    # Demo KB + outils : MOHHDY_AGENT_CONFIG=/app/agent/config.example.json
