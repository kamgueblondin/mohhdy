<!DOCTYPE html>
<html id="p125">
<head><title>Lot 125 true alignment, start and end apart from flex-start and flex-end, stretched grid rows</title>
<style>
body { margin: 0 }
#c125 { display: flex; width: 100px; height: 40px; margin-top: 20px; align-items: center }
#a125, #b125 { width: 20px; height: 60px }
#b125 { align-self: end }
#j125 { display: flex; width: 100px; margin-top: 20px; margin-left: 40px; justify-content: center }
#h125, #i125 { flex: 0 0 80px; height: 10px }
#w125, #x125 { display: flex; flex-wrap: wrap-reverse; width: 50px; height: 60px }
#w125 { align-content: start }
#x125 { align-content: flex-start }
#d125, #e125, #f125, #g125 { width: 30px; height: 10px }
#e125, #g125 { height: 20px }
#v125 { display: flex; flex-direction: row-reverse; width: 100px; justify-content: start }
#r125, #s125 { width: 20px; height: 10px }
#k125 { display: flex; width: 100px; height: 40px }
#m125 { display: grid; width: 50px }
#n125 { height: 50% }
</style></head>
<body id="q125">
<div id="c125"><div id="a125"></div><div id="b125"></div></div>
<div id="j125"><div id="h125"></div><div id="i125"></div></div>
<div id="w125"><div id="d125"></div><div id="e125"></div></div>
<div id="x125"><div id="f125"></div><div id="g125"></div></div>
<div id="v125"><div id="r125"></div><div id="s125"></div></div>
<div id="k125"><div id="m125"><div id="n125"></div></div></div>
</body>
</html>
