<!DOCTYPE html>
<html><head><title>Lot 69 font sizes</title>
<style>
body { margin: 8px; color: #000000 }
h1 { color: #000000; margin: 4px 0 }
.lead { font-size: 1.5em }
.big { font-size: 48px; line-height: 1 }
.tag { font-size: larger; color: #1a3a1a }
p { margin: 4px 0 }
</style></head>
<body>
<h1>Grand titre</h1>
<h2>Sous-titre 1.5em</h2>
<p class="lead">Texte d'accroche a 24 px</p>
<p>Texte normal a 16 px <span class="tag">plus grand</span> et <small>petit</small>.</p>
<p class="big">48px</p>
</body></html>
