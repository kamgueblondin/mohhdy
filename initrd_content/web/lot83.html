<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lot 83</title>
<style>
body{margin:8px;font-family:monospace}
#sp{width:200px}
#pa{padding-left:min(10%, 30px)}
#pb,#ml{height:10px;background:#ccc}
#ml{margin-left:max(5%, 3px)}
#mn{display:grid;width:100px;grid-template-columns:masonry;masonry-auto-flow:next;grid-template-rows:10px 10px;margin-top:8px}
#mn div,#fi div{height:10px;background:#888}
#st div{background:#888}
#fi{display:inline-grid;grid-template-columns:masonry;grid-template-rows:auto auto;margin-top:8px}
#p2{display:grid;width:100px;grid-template-columns:50px 50px;margin-top:8px}
#s2{display:grid;grid-column:1 / 3;grid-template-columns:subgrid;margin-left:auto}
#s2 div{height:10px;background:#999}
#st{display:grid;width:100px;align-items:stretch;grid-template-columns:masonry;grid-template-rows:10px 20px;margin-top:8px}
</style></head>
<body>
<!-- Lot 83: margin/padding math with %, masonry-auto-flow next, masonry intrinsic width, subgrid auto margins, masonry stretch. -->
<h1>Lot 83</h1>
<div id="sp"><div id="pa"><div id="pb"></div></div><div id="ml"></div></div>
<div id="mn"><div id="n0" style="width:50px"></div><div id="n1" style="width:5px"></div><div id="n2" style="width:5px"></div></div>
<div><div id="fi"><div id="f0" style="width:30px"></div><div id="f1" style="width:20px"></div><div id="f2" style="width:50px"></div></div></div>
<div id="p2"><div id="s2"><div id="j0"></div><div id="j1"></div></div></div>
<div id="st"><div id="t0" style="width:30px;height:10px"></div><div id="t1" style="width:20px"></div></div>
</body></html>
