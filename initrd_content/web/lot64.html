<!doctype html><html><head><title>Lot 64 writing modes columns layers</title><style>
body{margin:0}section{width:120px}
#vm{writing-mode:vertical-rl;height:16px;border-block-start:2px solid #ff0000}
#rt{width:120px;margin:0}
#mc{column-count:2;width:40px;column-rule:1px solid #008000}
#sp{column-span:all;height:4px;background:#0000ff}
#ed{width:20px;height:6px;border-style:solid dotted;border-width:2px 4px;border-color:#800080 #008080}
#bp{width:20px;height:6px;background:url(/images/mire-ga16.png) no-repeat right 2px bottom 1px / 6px 4px}
#bl{width:12px;height:4px;background-image:url(/images/mire-g1.png),url(/images/mire-ga16.png);background-size:2px 2px,6px 4px;background-repeat:no-repeat,repeat}
#ol{margin:0;width:80px}
#da{width:16px;height:12px;border:2px dotted #000080;border-radius:8px}
</style></head><body><section>
<div id=vm>ab</div>
<p id=rt dir=rtl>cd</p>
<div id=mc><div>e</div><div>f</div><div id=sp></div><div>g</div></div>
<div id=ed></div>
<div id=bp></div>
<div id=bl></div>
<ol id=ol dir=rtl><li>h</li></ol>
<div id=da></div>
</section></body></html>
