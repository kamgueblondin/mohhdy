<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lot 80</title>
<style>
body{margin:8px;font-family:monospace}
#g{display:grid;width:200px;grid-template-columns:20% 70%;column-gap:5%}
#g div{height:12px;background:#ccc}
#rows{display:grid;width:40px;height:100px;grid-template-columns:40px;grid-template-rows:30% 70%;align-items:stretch;margin-top:8px;background:#eee}
#rows div{background:#888}
#js{display:grid;width:120px;grid-template-columns:30px auto;justify-content:stretch;margin-top:8px;background:#ddd}
#js div{height:10px;background:#aaa}
#f{display:flex;width:200px;column-gap:10%;margin-top:8px}
#f div{width:20px;height:10px;background:#999}
</style></head>
<body>
<!-- Lot 80: percentage tracks, percentage gaps, justify-content stretch. -->
<h1>Lot 80</h1>
<div id="g"><div id="a"></div><div id="b"></div></div>
<div id="rows"><div id="r1"></div><div id="r2"></div></div>
<div id="js"><div id="j1"></div><div id="j2"></div></div>
<div id="f"><div id="f1"></div><div id="f2"></div></div>
</body></html>
