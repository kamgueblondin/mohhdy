<!doctype html><html><head><title>Lot 63 generated content transforms</title><style>
body{margin:0}section{width:120px}
#gc::before{content:"";display:block;width:40px;height:4px;background:#ff0000}
#gc::after{content:"[" attr(id) "]";color:#0000ff}
ul{margin:0;padding:0;list-style:none;counter-reset:n 4}li{counter-increment:n 2}
li::before{content:counter(n, upper-roman) ". "}
q{quotes:"<" ">"}
#rg{width:40px;height:20px;background:radial-gradient(circle closest-side at 10px 50%,#ff0000,#0000ff)}
#rt{margin:4px 0 0 20px;width:20px;height:10px;background:#008000;transform:rotate(45deg)}
#sk{margin-top:12px;width:20px;height:6px;background:#800080;transform:skewX(45deg);transform-origin:0 0}
#db{margin-top:2px;width:30px;height:8px;border:2px dashed #000080;border-radius:6px}
#rc{width:20px;height:20px;overflow:hidden;border-radius:10px;transform:translateX(50px)}#rk{height:20px;background:#ffa500}
#ov{width:16px;overflow-x:clip;white-space:nowrap}
</style></head><body><section>
<p id=gc style='margin:0'>&mdash;x</p>
<ul><li>a</li><li>b</li></ul>
<p style='margin:0'><q>hi</q></p>
<div id=rg></div>
<div id=rt></div>
<div id=sk></div>
<div id=db></div>
<div id=rc><div id=rk></div></div>
<div id=ov>abcdefgh</div>
</section></body></html>
