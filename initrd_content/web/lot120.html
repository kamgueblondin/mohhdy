<!DOCTYPE html>
<html id="h120">
<head><title>Lot 120 root box, initial containing block, style queries</title>
<style>
html { height: 50%; padding: 4px; border: 2px solid #000080 }
body { margin: 0; height: 100%; background: #e0f0ff }
#a120 { position: absolute; bottom: 0; right: 0; width: 20px; height: 10px; background: #800000 }
#b120 { position: absolute; top: 0; left: 0; width: 50%; height: 25% }
#c120 { container-name: theme }
#d120 { height: 10px }
@container theme style(--theme: dark) { #d120 { width: 100px; background: rgb(0 128 0) } }
#e120 { height: 10px }
@container style(--theme: light) { #e120 { background: red } }
@container style((--theme: dark) and (--size: 2)) { #e120 { width: 50px } }
#f120 { height: 10px; color: #0000ff; color: rgb(10deg 20 30); background: hsl(240deg 100% 50%) }
@container style(color: red) { #f120 { background: red } }
</style></head>
<body id="y120">
<!-- the guest pipeline resolves the sheet's custom properties before the
     engine (webrt_css_resolve_vars): the container's are in its style -->
<div id="c120" style="--theme: dark; --size: 2"><div id="d120"></div><div id="e120"></div></div>
<div id="f120"></div>
<div id="a120"></div>
<div id="b120"></div>
</body>
</html>
