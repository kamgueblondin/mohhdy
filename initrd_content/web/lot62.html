<!doctype html><html><head><title>Lot 62 alpha transform paint order</title><style>
body{margin:0}section{width:120px}
#al{height:10px;background:#0000ff}#ar{margin-top:-10px;width:60px;height:10px;background:rgba(255,0,0,0.5)}
#b3{width:20px;height:4px;border:2px ridge #3090f0}
#tf{width:10px;height:10px;background:#008000;transform:translate(30px,0) scale(2,1)}
#ol{margin:2px;width:20px;height:6px;background:#ffff00;outline:2px solid #ff00ff}
#sh{width:20px;height:6px;background:#000080;box-shadow:4px 2px #808080}
#dc{margin:0;text-decoration:underline #ff0000}
#pc{margin-left:25%;height:4px;background:#00ffff}
#fl{float:left;margin-top:-10px;width:20px;height:10px;background:#ffa500}
#tt{margin:0;text-transform:uppercase;text-shadow:1px 1px #c0c0c0}
#gr{height:8px;background:linear-gradient(#000000,#ffffff)}
#rd{width:20px;height:12px;background:#800000;border-radius:6px}
#el{width:40px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
ol{margin:0;padding-left:40px}
#rc{width:20px;height:20px;overflow:hidden;border-radius:10px}#rk{height:20px;background:#ff0000}
#js{margin:0;width:100px;text-align:justify}#ls{margin:0;letter-spacing:2px}
#rg{width:30px;height:30px;background:radial-gradient(circle closest-side,#ff0000,#0000ff)}
#gp{display:grid;grid-template-columns:40px 80px}#gq{margin-left:10%;height:4px;background:#00ff00}
</style></head><body><section>
<div id=al></div><div id=ar></div>
<div id=b3></div>
<div id=tf></div>
<div id=ol></div>
<div id=sh></div>
<p id=dc>ab</p>
<div id=pc></div>
<p id=tt>up</p><div id=fl></div>
<div id=gr></div>
<div id=rd></div>
<div id=el>abcdefgh</div>
<ol start=4 type=i><li>x</li></ol>
<div id=rc><div id=rk></div></div>
<p id=js>aa bb cc dd ee</p><p id=ls>AB</p>
<div id=rg></div>
<div id=gp><div></div><div id=gq></div></div>
</section></body></html>
