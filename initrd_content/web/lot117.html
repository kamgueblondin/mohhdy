<!DOCTYPE html>
<html style="font-size:20px">
<head><title>Lot 117 font-relative lengths</title>
<style>
body { margin: 0 }
#a117 { margin-left: 2em; font-size: 15px; height: 10px; background: #ff0000 }
#b117 { font-size: 13.5px; line-height: 1.5; background: #00ff00 }
#c117 { width: calc(2.5em + 1rem); height: 8px; background: #0000ff }
#d117 { padding-left: 2ch; height: 3ex; background: #808080 }
#e117 { line-height: 20.6px; line-clamp: 2 }
#f117 { font-size: calc(1em + 4px); height: 1lh }
#g117 { line-height: 2rlh }
#h117 { border: 0.25em solid #000000; width: 4cap; height: 1ic }
#i117 { margin-top: 1rlh; font-size: smaller; line-height: 2; padding-top: 0.5lh }
</style></head>
<body>
<div id="a117"></div>
<div id="b117">a<br>b<br>c<br>d</div>
<div id="c117"></div>
<div id="d117"></div>
<div id="e117">e<br>f<br>g<br>h</div>
<div id="f117"></div>
<div id="g117">g</div>
<div id="h117"></div>
<div id="i117">i</div>
</body>
</html>
