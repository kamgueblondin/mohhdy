<!DOCTYPE html>
<html id="p128">
<head><title>Lot 128 fractional flex-grow, flex-shrink and flex factors</title>
<style>
body { margin: 0 }
#g128 { display: flex; width: 100px; margin-top: 20px }
#a128 { flex-grow: 0.5; width: 0px; height: 10px }
#b128 { flex-grow: 1.5; width: 0px; height: 10px }
#s128 { display: flex; width: 100px; margin-top: 10px }
#c128 { flex: 0.25 0 0; height: 10px }
#d128 { flex: .5 0 0; height: 10px }
#k128 { display: flex; width: 100px; margin-top: 10px }
#e128 { flex: 0.5 0 0; max-width: 10px; height: 10px }
#f128 { flex: 0.25 0 0; height: 10px }
#t128 { display: flex; width: 8px; margin-top: 10px }
#l128 { flex: 0.3 0 0; height: 10px }
#m128 { flex: 0.3 0 0; height: 10px }
#n128 { flex: 0.3 0 0; height: 10px }
#h128 { display: flex; width: 100px; margin-top: 10px }
#i128 { width: 80px; flex-shrink: 0.5; height: 10px }
#j128 { width: 80px; flex-shrink: 1.5; height: 10px }
#o128 { display: flex; width: 100px; margin-top: 10px }
#u128 { width: 80px; flex-shrink: 0.25; min-width: 75px; height: 10px }
#v128 { width: 80px; flex-shrink: 0.25; height: 10px }
#x128 { display: flex; width: 100px; margin-top: 10px }
#w128 { width: 200px; flex-shrink: 0.1; height: 10px }
#y128 { width: 20px; flex-shrink: 0.8; min-width: 19px; height: 10px }
#z128 { display: flex; width: 50px; margin-top: 10px }
#za128 { flex: 0 0.5 0; height: 10px }
#zb128 { flex: 0 0.5 100px; height: 10px }
</style></head>
<body id="q128">
<div id="g128"><div id="a128"></div><div id="b128"></div></div>
<div id="s128"><div id="c128"></div><div id="d128"></div></div>
<div id="k128"><div id="e128"></div><div id="f128"></div></div>
<div id="t128"><div id="l128"></div><div id="m128"></div><div id="n128"></div></div>
<div id="h128"><div id="i128"></div><div id="j128"></div></div>
<div id="o128"><div id="u128"></div><div id="v128"></div></div>
<div id="x128"><div id="w128"></div><div id="y128"></div></div>
<div id="z128"><div id="za128"></div><div id="zb128"></div></div>
</body>
</html>
