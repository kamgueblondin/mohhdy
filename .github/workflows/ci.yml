        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # US-063 two relays, US-069 relay crash + reboot + rejoin (about 2 min).
      - name: QEMU P2P four guests (two-relay path, crash, rejoin)
        run: make qemu-p2p-mesh

      # Moved from the vfs-service job (lot 5) for headroom under 15 min:
      # PromptMessage, strict network, loss recovery, loopback worker
      # (about 4 min together).
      - name: QEMU phase 4 PromptMessage (guest shell, about 1 min)
        run: make qemu-promptmessage

      # Strict network kernel (NET_RING0_FALLBACK=0): networker is the only
      # network path, no Ring 0 fallback after its death (about 1 min).
      - name: QEMU strict network build, no Ring 0 fallback
        run: make qemu-net-no-ring0

      # Guest TCP/TLS loss recovery: dropped ClientHello and Certificate,
      # duplicated ServerKeyExchange (about 2 min).
      - name: QEMU TCP/TLS loss recovery (frame drop)
        run: make qemu-net-loss-recovery

      - name: QEMU strict network build, loopback-only worker (no NE2000)
        run: make qemu-net-loopback-worker

      - name: QEMU gRPC over guest TCP between two guests (Lot 6 US-067, about 1 min)
        run: make qemu-grpc-guests

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-logs
          if-no-files-found: ignore
          path: |
            test_logs/

