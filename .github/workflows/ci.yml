# MOHHDY CI — build, unit tests, QEMU smoke boot
# Default branch is master (main is listed so a rename would still work).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-test:
    name: Build, tests, QEMU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            python3-cryptography \
            qemu-system-x86

      - name: Build OS image
        run: make all

      - name: Verify build artifacts
        run: |
          test -s build/mohhdy.bin
          test -s my_initrd.tar
          ls -lh build/mohhdy.bin my_initrd.tar
          file build/mohhdy.bin

      - name: Run unit tests (make test-all)
        run: make test-all

      # Guard: the two integration shards cover exactly the seven contracts.
      - name: Integration shard coverage (dry run)
        run: |
          plan() { env "$@" QEMU_INTEGRATION_DRY_RUN=1 python3 tests/integration/run_qemu_contracts.py | sed -n 's/^\[QEMU integration\] plan \([^:]*\):.*/\1/p' | sort; }
          plan X=1 > /tmp/all.txt
          { plan QEMU_INTEGRATION_ONLY=vfs-service; plan QEMU_INTEGRATION_SKIP=vfs-service; } | sort > /tmp/union.txt
          test "$(wc -l < /tmp/all.txt)" -eq 7
          diff /tmp/all.txt /tmp/union.txt

      # qemu-ne2k-tls-multipair moved to the integration-qemu-rest job
      # (still run on every PR, it just no longer serializes behind qemu-smoke).
      - name: QEMU smoke (systeme)
        run: make qemu-smoke

      # Strict network kernel (NET_RING0_FALLBACK=0): networker is the only
      # network path, no Ring 0 fallback after its death (about 1 min).
      - name: QEMU strict network build, no Ring 0 fallback
        run: make qemu-net-no-ring0

      - name: QEMU strict network build, loopback-only worker (no NE2000)
        run: make qemu-net-loopback-worker

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # The seven QEMU integration contracts run as two parallel shards with no
  # dependency on build-and-test (each job builds its own image in ~20 s).
  # Union of the shards = make integration-qemu (checked in build-and-test).
  integration-qemu-vfs:
    name: QEMU integration contracts (vfs-service)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            qemu-system-x86

      - name: Build OS image
        run: make all

      - name: Run QEMU integration shard (vfs-service)
        run: make integration-qemu-vfs

      # Inventory item 4, GGUF slice: 109/110 sampling steps in the Ring 3
      # aiworker. No GPT-2 GGUF weights in CI: synthetic K-quant GGUF
      # (tests/scripts/ai_gguf_fixture.py) on a FAT16 IDE disk, token
      # equality worker / Ring 0 / fallback (~215 s locally, one boot).
      # Placed in the shortest job so the CI wall time stays bounded.
      - name: QEMU aiworker Ring 3 GGUF steps (hors integration-qemu)
        run: make qemu-ai-gguf

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-qemu-vfs-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  integration-qemu-rest:
    name: QEMU integration contracts (other six + NE2000 multipair + net relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            qemu-system-x86

      - name: Build OS image
        run: make all

      - name: Run QEMU integration shard (all contracts except vfs-service)
        run: make integration-qemu-rest

      - name: QEMU NE2000 TLS multipair (moved from build-and-test)
        run: make qemu-ne2k-tls-multipair

      # Tranche 5 slices 1-2: net-driver gate and net IPC relay (no disk).
      - name: QEMU Tranche 5 net-driver gate + IPC relay
        run: make qemu-net-worker

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-qemu-rest-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # OS-UI Ring 3 : registre + contrat QEMU. Independant des shards integration. Facade Python retiree (OS-UI-3).
  osui-guest:
    name: OS-UI guest C
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            qemu-system-x86 \
            python3-cryptography

      - name: Build OS image
        run: make all

      - name: Registry + Python facade removed
        run: make osui-smoke

      - name: QEMU OS-UI contract (hors integration-qemu)
        run: make qemu-osui-runtime

      - name: QEMU OS-UI GUI smoke (hors integration-qemu)
        run: make qemu-osui-gui

      # Tranche 4 : pilote ATA Ring 3 (IOPB TSS + IPC), job parallele,
      # n'allonge pas integration-qemu (~110 s, deux boots).
      - name: QEMU Tranche 4 Ring 3 ATA driver (hors integration-qemu)
        run: make qemu-ata-driver

      # Tranche 5 slice 3: wire TCP through the net-driver worker to a local
      # echo peer (-netdev socket, no internet). Placed in this job because
      # it is the shortest one (~6.5 min), so the CI wall time is unchanged.
      - name: QEMU Tranche 5 wire TCP via worker (hors integration-qemu)
        run: make qemu-net-wire

      # Inventory item 4: GPT-2 FP32 in the Ring 3 aiworker. CI has no GPT-2
      # weights: the contract packs the synthetic llm.c checkpoint of
      # tests/scripts/ai_worker_fixture.py, proves worker / Ring 0 /
      # fallback token equality and rogue refusal, then restores the initrd
      # (~80 s locally, one boot).
      - name: QEMU aiworker Ring 3 GPT-2 (hors integration-qemu)
        run: make qemu-ai-worker

      # Worker contracts proven locally but previously off-CI (~35 s each
      # locally): TLS/HTTP through the Ring 3 networker stack (local TLS 1.2
      # peer, no internet) and the foundation steps (cap-token, id-key,
      # spill-drops across a reboot, right-token ata-driver refused).
      - name: QEMU Tranche 5 TLS/HTTP via networker (hors integration-qemu)
        run: make qemu-net-tls-worker

      - name: QEMU foundation steps (hors integration-qemu)
        run: make qemu-foundation-steps

      - name: Upload OS-UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osui-guest-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  # Guest-to-guest TLS 1.2 + encrypted METIER chat through networker on the
  # default strict kernel: two QEMU guests on the local shared Ethernet hub
  # (no TAP, no Internet, no secret). About 120 s locally. Own job so no
  # other job grows.
  net-peer-tls:
    name: QEMU guest-guest TLS through networker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            python3-cryptography \
            qemu-system-x86

      - name: Build OS image
        run: make all

      - name: QEMU guest-guest TLS + encrypted peer chat via networker
        run: make qemu-net-peer-tls-worker

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-peer-tls-logs
          if-no-files-found: ignore
          path: |
            test_logs/
