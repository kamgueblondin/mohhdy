      - name: Build OS image
        run: make all

      # Lot 48: US-070, US-068/073, US-075, US-069 continuous (about 4 min).
      - name: QEMU P2P phase 5 (three guests, hub delay/drop/cut, three crash cycles)
        run: make qemu-p2p-phase5

      - name: Upload logs
        if: always()
