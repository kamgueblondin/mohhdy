# MOHHDY CI - build, unit tests, QEMU smoke boot
# Default branch is master (main is listed so a rename would still work).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-test:
    name: Build, tests, QEMU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Verify build artifacts
        run: |
          test -s build/mohhdy.bin
          test -s my_initrd.tar
          ls -lh build/mohhdy.bin my_initrd.tar
          file build/mohhdy.bin

      - name: Strict image without Ring 0 net stack + no secrets (sizes)
        run: make strict-image-check secrets-check

      # Guard: the two integration shards cover exactly the seven contracts.
      - name: Integration shard coverage (dry run)
        run: |
          plan() { env "$@" QEMU_INTEGRATION_DRY_RUN=1 python3 tests/integration/run_qemu_contracts.py | sed -n 's/^\[QEMU integration\] plan \([^:]*\):.*/\1/p' | sort; }
          plan X=1 > /tmp/all.txt
          { plan QEMU_INTEGRATION_ONLY=vfs-service; plan QEMU_INTEGRATION_SKIP=vfs-service; } | sort > /tmp/union.txt
          test "$(wc -l < /tmp/all.txt)" -eq 7
          diff /tmp/all.txt /tmp/union.txt

      # qemu-ne2k-tls-multipair moved to the integration-qemu-rest job
      # (still run on every PR, it just no longer serializes behind qemu-smoke).
      - name: QEMU smoke (systeme)
        run: make qemu-smoke

      - name: Tree clean outside build/
        run: make tree-clean-check

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # The seven QEMU integration contracts run as two parallel shards with no
  # dependency on build-and-test (each job builds its own image in ~20 s).
  # Union of the shards = make integration-qemu (checked in build-and-test).
  integration-qemu-vfs:
    name: QEMU integration contracts (vfs-service)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Run QEMU integration shard (vfs-service)
        run: make integration-qemu-vfs

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-qemu-vfs-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # Inventory item 4, GGUF slices: 109/110 tokenizer, session and sampling
  # steps in the Ring 3 aiworker. No GPT-2 GGUF weights in CI: synthetic
  # K-quant GGUF (tests/scripts/ai_gguf_fixture.py) on a FAT16 IDE disk,
  # token equality worker / Ring 0 / fallback / resumed session (~280 s
  # locally, about 6 min on a runner). Own job since the session scenes
  # pushed the vfs-service job past 15 min.
  ai-gguf:
    name: QEMU aiworker Ring 3 GGUF session
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: QEMU aiworker Ring 3 GGUF session (hors integration-qemu)
        run: make qemu-ai-gguf

      # Lot 9 headroom: moved from integration-qemu-rest.
      # Tranche 5 slices 1-2: net-driver gate and net IPC relay (no disk).
      - name: QEMU Tranche 5 net-driver gate + IPC relay
        run: make qemu-net-worker

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gguf-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  # Headroom: cached apt debs (scripts/ci-install-deps.sh), one initrd
  # pack per job (build/.initrd-stamp), and echo-paced PS/2 input in
  # qemu-production / qemu-persistence. timeout-minutes stays 20.
  production:
    name: QEMU production + persistence across reboot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # Lot 9 headroom: moved from build-and-test (unit tests, registry,
      # facade check; the coverage job also runs the unit tests).
      - name: Run unit tests (make test-all)
        run: make test-all

      - name: Phase 8 production contract (one guest)
        run: make qemu-production

      - name: Persistence across a cold reboot (two boots, same disk)
        run: make qemu-persistence

      - name: QEMU OS-UI local API over HTTP via networker (host HTTP client)
        run: make qemu-osui-web

      # US-001: PCI enumeration by the Ring 3 pcidriver, rogue #GP,
      # supervised respawn after kill (about 2 min).
      - name: QEMU Ring 3 PCI driver (supervised restart)
        run: make qemu-pci-driver

      # Lot 5 (US-001): PS/2 and COM1 Ring 3 drivers, rogue #GP, kill and
      # supervised respawn of both (about 1 min).
      - name: QEMU Ring 3 PS/2 and serial drivers (supervised restart)
        run: make qemu-input-drivers

      # Lot 8 (US-001): UHCI USB tablet driver in Ring 3, kernel-checked
      # DMA, kill and supervised respawn (about 1 min).
      - name: QEMU Ring 3 UHCI USB tablet driver (supervised restart)
        run: make qemu-usb-driver

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  coverage:
    name: Host unit-test coverage (gcov floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      # Measured 79.56% on 2026-10-17. The floor fails the job on a drop.
      - name: make coverage (host unit tests, gcov line floor)
        run: make coverage COVERAGE_MIN=78

      # Lot 9 headroom: phase 6 platform contract moved here from ai-gguf.
      - name: Build OS image
        run: make all

      - name: QEMU phase 6 platform groundwork (HAL, screen, power, devices, migration, deploy)
        run: make qemu-platform

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            test_logs/coverage_report.txt

  # Lot 8 (US-076): ARMv7-A kernel core on qemu-system-arm -M virt. Own
  # job: its toolchain is separate from the i386 one (about 2 min).
  arm-port:
    name: ARM kernel core (qemu-system-arm virt)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain and QEMU
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Build and boot the ARM kernel (make qemu-arm-boot)
        run: make arm-kernel qemu-arm-boot

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-logs
          if-no-files-found: ignore
          path: test_logs/arm-boot.log

  p2p-mesh:
    name: QEMU P2P four guests + strict network contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # US-063 two relays, US-069 relay crash + reboot + rejoin (about 2 min).
      - name: QEMU P2P four guests (two-relay path, crash, rejoin)
        run: make qemu-p2p-mesh

      # Moved from the vfs-service job (lot 5) for headroom under 15 min:
      # PromptMessage, strict network, loss recovery, loopback worker
      # (about 4 min together).
      - name: QEMU phase 4 PromptMessage (guest shell, about 1 min)
        run: make qemu-promptmessage

      # Strict network kernel (NET_RING0_FALLBACK=0): networker is the only
      # network path, no Ring 0 fallback after its death (about 1 min).
      - name: QEMU strict network build, no Ring 0 fallback
        run: make qemu-net-no-ring0

      # Guest TCP/TLS loss recovery: dropped ClientHello and Certificate,
      # duplicated ServerKeyExchange (about 2 min).
      - name: QEMU TCP/TLS loss recovery (frame drop)
        run: make qemu-net-loss-recovery

      - name: QEMU strict network build, loopback-only worker (no NE2000)
        run: make qemu-net-loopback-worker

      - name: QEMU gRPC over guest TCP between two guests (Lot 6 US-067, about 1 min)
        run: make qemu-grpc-guests

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  gui-parity:
    name: QEMU desktop GUI parity (UX4 tools + UX5)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # UX4 (moved from p2p-mesh for headroom): about 3 min
      - name: QEMU desktop tool apps (task manager, settings, P2P, PM run, viewer, chat)
        run: make qemu-gui-tools

      # UX5: dynamic editor, pixel viewer, registry tools, new GUI surfaces
      - name: QEMU UX5 GUI parity
        run: make qemu-gui-ux5

      # UX5: one desktop panel per terminal command family (about 1.5 min)
      - name: QEMU UX5 GUI parity panels (network, storage, services, logs, ledger, prod, security, search, devtools, notes, /cmd)
        run: make qemu-gui-parity

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-parity-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  gui-panels:
    name: QEMU desktop panels, every entry (Lot 46)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # Lot 46: 64 entries of /net /disk /services /logs /ci /security
      # /devtools /notes (about 3 min under TCG)
      - name: QEMU GUI panels, every entry with arguments and confirmations
        run: make qemu-gui-panels

      # Lot 46 PR B (US-G16): editor Save As of 64 KiB, v4 overlay image
      # over LBA 0-63 + 4225-4352, byte exact on disk, cold reboot, FAT16
      # volume untouched, 64 KiB + 1 refused (two boots, about 5 min)
      - name: QEMU large save (64 KiB) across a reboot
        run: make qemu-gui-bigsave

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-panels-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  p2p:
    name: QEMU P2P three guests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: QEMU P2P three guests (discovery, encrypted links, replication, consensus, relay)
        run: make qemu-p2p

      - name: QEMU console line editor, text mode + terminal window (about 1.5 min)
        run: make qemu-line-edit

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  # Lot 9 headroom: the collab ledger left the p2p job (12:32 in lot 8).
  collab:
    name: QEMU collaborative ledger three guests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Phase 7 collaborative ledger (three guests)
        run: make qemu-collab

      - name: QEMU GUI window manager (panes, chat, dock, terminal minimize, about 1 min)
        run: make qemu-gui-windows

      - name: QEMU terminal grid follows maximize and screen resize (reflow, about 1 min)
        run: make qemu-gui-term-resize

      - name: QEMU desktop explorer + editor, saved file read by cat in the terminal (about 1 min)
        run: make qemu-gui-apps

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collab-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  integration-qemu-rest:
    name: QEMU integration contracts (other six + NE2000 multipair + net relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Run QEMU integration shard (all contracts except vfs-service)
        run: make integration-qemu-rest

      - name: QEMU NE2000 TLS multipair (moved from build-and-test)
        run: make qemu-ne2k-tls-multipair

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-qemu-rest-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # OS-UI Ring 3 : registre + contrat QEMU. Independant des shards integration. Facade Python retiree (OS-UI-3).
  osui-guest:
    name: OS-UI guest C
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Registry + Python facade removed
        run: make osui-smoke

      - name: QEMU OS-UI contract (hors integration-qemu)
        run: make qemu-osui-runtime

      - name: QEMU OS-UI GUI smoke (hors integration-qemu)
        run: make qemu-osui-gui

      # Tranche 4 : pilote ATA Ring 3 (IOPB TSS + IPC), job parallele,
      # n'allonge pas integration-qemu (~110 s, deux boots).
      - name: QEMU aiworker Ring 3 GPT-2 (hors integration-qemu)
        run: make qemu-ai-worker

      # Worker contracts proven locally but previously off-CI (~35 s each
      # locally): TLS/HTTP through the Ring 3 networker stack (local TLS 1.2
      # peer, no internet) and the foundation steps (cap-token, id-key,
      # spill-drops across a reboot, right-token ata-driver refused).
      - name: QEMU Tranche 5 TLS/HTTP via networker (hors integration-qemu)
        run: make qemu-net-tls-worker

      - name: QEMU foundation steps (hors integration-qemu)
        run: make qemu-foundation-steps

      - name: Upload OS-UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osui-guest-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  # Guest-to-guest TLS 1.2 + encrypted METIER chat through networker on the
  # default strict kernel: two QEMU guests on the local shared Ethernet hub
  # (no TAP, no Internet, no secret). About 120 s locally. Own job so no
  # other job grows.
  net-peer-tls:
    name: QEMU guest-guest TLS through networker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: QEMU guest-guest TLS + encrypted peer chat via networker
        run: make qemu-net-peer-tls-worker

      - name: QEMU Tranche 5 wire TCP via worker (moved from OS-UI guest C for the 15 min budget)
        run: make qemu-net-wire

      - name: QEMU OS-UI peer provider (local QEMU peer, timeout fallback)
        run: make qemu-osui-peer

      - name: QEMU Tranche 4 Ring 3 ATA driver (moved from OS-UI guest C, 15 min budget)
        run: make qemu-ata-driver

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-peer-tls-logs
          if-no-files-found: ignore
          path: |
            test_logs/
