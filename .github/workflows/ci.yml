# MOHHDY CI - build, unit tests, QEMU smoke boot
# Default branch is master (main is listed so a rename would still work).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-test:
    name: Build, tests, QEMU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Verify build artifacts
        run: |
          test -s build/mohhdy.bin
          test -s my_initrd.tar && test -s my_initrd_test.tar
          ls -lh build/mohhdy.bin my_initrd.tar
          file build/mohhdy.bin

      - name: Strict image without Ring 0 net stack + no secrets (sizes)
        run: make strict-image-check secrets-check roadmap-check

      # Guard: the two integration shards cover exactly the seven contracts.
      - name: Integration shard coverage (dry run)
        run: |
          plan() { env "$@" QEMU_INTEGRATION_DRY_RUN=1 python3 tests/integration/run_qemu_contracts.py | sed -n 's/^\[QEMU integration\] plan \([^:]*\):.*/\1/p' | sort; }
          plan X=1 > /tmp/all.txt
          { plan QEMU_INTEGRATION_ONLY=vfs-service; plan QEMU_INTEGRATION_SKIP=vfs-service; } | sort > /tmp/union.txt
          test "$(wc -l < /tmp/all.txt)" -eq 7
          diff /tmp/all.txt /tmp/union.txt

      # qemu-ne2k-tls-multipair moved to the integration-qemu-rest job
      # (still run on every PR, it just no longer serializes behind qemu-smoke).
      - name: QEMU smoke (systeme)
        run: make qemu-smoke

      - name: Tree clean outside build/
        run: make tree-clean-check

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # The seven QEMU integration contracts run as two parallel shards with no
  # dependency on build-and-test (each job builds its own image in ~20 s).
  # Union of the shards = make integration-qemu (checked in build-and-test).
  integration-qemu-vfs:
    name: QEMU integration contracts (vfs-service)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: Run QEMU integration shard (vfs-service)
        run: make integration-qemu-vfs

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-qemu-vfs-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log

  # Inventory item 4, GGUF slices: 109/110 tokenizer, session and sampling
  # steps in the Ring 3 aiworker. No GPT-2 GGUF weights in CI: synthetic
  # K-quant GGUF (tests/scripts/ai_gguf_fixture.py) on a FAT16 IDE disk,
  # token equality worker / Ring 0 / fallback / resumed session (~280 s
  # locally, about 6 min on a runner). Own job since the session scenes
  # pushed the vfs-service job past 15 min.
  ai-gguf:
    name: QEMU aiworker Ring 3 GGUF session
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      - name: QEMU aiworker Ring 3 GGUF session (hors integration-qemu)
        run: make qemu-ai-gguf

      # Lot 9 headroom: moved from integration-qemu-rest.
      # Tranche 5 slices 1-2: net-driver gate and net IPC relay (no disk).
      - name: QEMU Tranche 5 net-driver gate + IPC relay
        run: make qemu-net-worker

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gguf-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  # Headroom: cached apt debs (scripts/ci-install-deps.sh), one initrd
  # pack per job (build/.initrd-stamp), and echo-paced PS/2 input in
  # qemu-production / qemu-persistence. timeout-minutes stays 20.
  production:
    name: QEMU production + persistence across reboot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Build OS image
        run: make all

      # Lot 9 headroom: moved from build-and-test (unit tests, registry,
      # facade check; the coverage job also runs the unit tests).
      - name: Run unit tests (make test-all)
        run: make test-all

      - name: Phase 8 production contract (one guest)
        run: make qemu-production

      - name: Persistence across a cold reboot (two boots, same disk)
        run: make qemu-persistence

      - name: QEMU OS-UI local API over HTTP via networker (host HTTP client)
        run: make qemu-osui-web

      # US-001: PCI enumeration by the Ring 3 pcidriver, rogue #GP,
      # supervised respawn after kill (about 2 min).
      - name: QEMU Ring 3 PCI driver (supervised restart)
        run: make qemu-pci-driver

      # Lot 5 (US-001): PS/2 and COM1 Ring 3 drivers, rogue #GP, kill and
      # supervised respawn of both (about 1 min).
      - name: QEMU Ring 3 PS/2 and serial drivers (supervised restart)
        run: make qemu-input-drivers

      # Lot 8 (US-001): UHCI USB tablet driver in Ring 3, kernel-checked
      # DMA, kill and supervised respawn (about 1 min).
      - name: QEMU Ring 3 UHCI USB tablet driver (supervised restart)
        run: make qemu-usb-driver

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs
          if-no-files-found: ignore
          path: |
            test_logs/

  coverage:
    name: Host unit-test coverage (gcov floor)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .apt-cache
          key: ci-apt-v1-${{ runner.os }}-${{ hashFiles('scripts/ci-install-deps.sh') }}

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      # Measured 79.56% on 2026-10-17. The floor fails the job on a drop.
      - name: make coverage (host unit tests, gcov line floor)
        run: make coverage COVERAGE_MIN=78

      # Lot 9 headroom: phase 6 platform contract moved here from ai-gguf.
      - name: Build OS image
        run: make all

      - name: QEMU phase 6 platform groundwork (HAL, screen, power, devices, migration, deploy)
        run: make qemu-platform

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            test_logs/coverage_report.txt

  # Lot 8 (US-076): ARMv7-A kernel core on qemu-system-arm -M virt. Own
  # job: its toolchain is separate from the i386 one (about 2 min).
  arm-port:
    name: ARM kernel core (qemu-system-arm virt)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lot 46: two runs were cancelled at 15 min while apt crawled from
      # the runner's Azure mirror (~100 KB/s on the 57 MB gcc package).
      # The .debs are cached; each attempt is bounded and the retry uses
      # the main Ubuntu archive instead of the Azure mirror.
      - name: Cache ARM toolchain packages
        uses: actions/cache@v4
        with:
          path: ~/apt-arm
          key: apt-arm-${{ runner.os }}-noble-v1

      # Lot 90: run 42763680795 (Lot 89) hit the 11 min step limit while
      # attempt 1 stalled on the Azure mirror; two bounded attempts need up
      # to 18 min, so the step gets 19 and the job 25.
      - name: Install ARM toolchain and QEMU
        timeout-minutes: 19
        run: |
          mkdir -p ~/apt-arm/partial
          pkgs="gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm"
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 -o Dir::Cache::archives=$HOME/apt-arm"
          for i in 1 2; do
            if timeout 120 sudo apt-get update $opts && \
               timeout 420 sudo apt-get install -y --no-install-recommends $opts $pkgs; then
              sudo chown -R "$USER" ~/apt-arm
              exit 0
            fi
            echo "apt attempt $i failed; switching to archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1

      - name: Build and boot the ARM kernel (make qemu-arm-boot)
        run: make arm-kernel qemu-arm-boot

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-logs
          if-no-files-found: ignore
          path: test_logs/arm-boot.log

