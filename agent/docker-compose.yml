# Compose local de l'instance Mohhdy (scaffold userspace).
# Docker boot le SE comme sur une machine vierge. Pas un produit a cote.
# ADMIN_TOKEN optionnel via l'environnement hote, jamais cuit dans l'image.
# Exemple : ADMIN_TOKEN=change-me docker compose up --build

services:
  mohhdy-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: mohhdy-agent:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MOHHDY_AGENT_HOST: "0.0.0.0"
      MOHHDY_AGENT_PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MOHHDY_AGENT_CONFIG: "${MOHHDY_AGENT_CONFIG:-}"
      MOHHDY_AGENT_KB: "${MOHHDY_AGENT_KB:-}"
      MOHHDY_AGENT_DATA: "${MOHHDY_AGENT_DATA:-}"
      MOHHDY_AGENT_MODE: "${MOHHDY_AGENT_MODE:-self_host}"
      MOHHDY_AGENT_RUNTIME: "${MOHHDY_AGENT_RUNTIME:-docker}"
      MOHHDY_AGENT_SITE_ID: "${MOHHDY_AGENT_SITE_ID:-}"
    # Pas de env_file. Ne pas copier de secret dans le build.
    # Pour la demo KB + outils : MOHHDY_AGENT_CONFIG=/app/config.example.json

  # Profil optionnel slim : runtime=browser, PAS Chromium.
  # Chromium : profil compose `playwright` (cible extra, hors CI).
  # Les gestes de session restent le simulateur DOM.
  mohhdy-agent-browser:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
    image: mohhdy-agent:browser
    ports:
      - "8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MOHHDY_AGENT_HOST: "0.0.0.0"
      MOHHDY_AGENT_PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MOHHDY_AGENT_CONFIG: "${MOHHDY_AGENT_CONFIG:-/app/config.example.json}"
      MOHHDY_AGENT_HARNESS: "dom_simulator"
      MOHHDY_AGENT_BROWSER_ENGINE: "${MOHHDY_AGENT_BROWSER_ENGINE:-off}"
      MOHHDY_AGENT_MODE: "${MOHHDY_AGENT_MODE:-self_host}"
      MOHHDY_AGENT_RUNTIME: "${MOHHDY_AGENT_RUNTIME:-browser}"
      MOHHDY_AGENT_SITE_ID: "${MOHHDY_AGENT_SITE_ID:-}"

  # Profil extra : Playwright + Chromium (gros). Hors make agent-smoke / CI AOS.
  # Ce n'est PAS US-031. Les gestes de session restent le simulateur DOM.
  mohhdy-agent-playwright:
    profiles: ["playwright"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
      target: playwright
    image: mohhdy-agent:playwright
    ports:
      - "8082:8080"
    shm_size: "1gb"
    environment:
      MOHHDY_AGENT_HOST: "0.0.0.0"
      MOHHDY_AGENT_PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MOHHDY_AGENT_CONFIG: "${MOHHDY_AGENT_CONFIG:-/app/config.example.json}"
      MOHHDY_AGENT_HARNESS: "dom_simulator"
      MOHHDY_AGENT_BROWSER_ENGINE: "playwright"
      MOHHDY_AGENT_PLAYWRIGHT_NO_SANDBOX: "1"
      MOHHDY_AGENT_MODE: "${MOHHDY_AGENT_MODE:-self_host}"
      MOHHDY_AGENT_RUNTIME: "${MOHHDY_AGENT_RUNTIME:-browser}"
      MOHHDY_AGENT_SITE_ID: "${MOHHDY_AGENT_SITE_ID:-}"
