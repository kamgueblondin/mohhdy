# Compose local : boot QEMU du SE Multiboot (OS-UI-3).
# Contexte = racine du depot. Pas de port HTTP, pas de jeton admin cuit.
# Defaut nographic (CI) : docker compose run --rm mohhdy-os
# Bureau VGA : make run-gui sur l'hote, ou docker/qemu-gui.sh + DISPLAY.
# Dans le guest, commande canonique : gui (aliases graphics, desktop).

services:
  mohhdy-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: mohhdy-os:local
    stdin_open: true
    tty: true
    environment:
      MOHHDY_RAM: "${MOHHDY_RAM:-256M}"
